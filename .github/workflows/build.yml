name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      env:
        PCL_BUILD_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        PCL_BUILD_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        PCL_BUILD_COMMIT_SHA: ${{ github.sha }}
      run: |
        function Replace-Literal($path, $original, $replacement) {
          $path = (Resolve-Path -LiteralPath $path).Path
          $content = Get-Content -LiteralPath $path -Raw -Encoding UTF8
          if (-not $content.Contains($original)) { throw "Build declaration not found in $path" }
          [IO.File]::WriteAllText($path, $content.Replace($original, $replacement), [Text.UTF8Encoding]::new($false))
        }
        $clientId = ([string]$env:PCL_BUILD_MS_CLIENT_ID).Replace('"', '""')
        $curseForgeKey = ([string]$env:PCL_BUILD_CURSEFORGE_API_KEY).Replace('"', '""')
        Replace-Literal 'Plain Craft Launcher 2\Modules\ModSecret.vb' 'Public OAuthClientId As String = ""' ('Public OAuthClientId As String = "' + $clientId + '"')
        Replace-Literal 'Plain Craft Launcher 2\Modules\ModSecret.vb' 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")' ('Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "' + $curseForgeKey + '")')
        Replace-Literal 'Plain Craft Launcher 2\Modules\Base\ModBase.vb' 'Public Const CommitHash As String = ""' ('Public Const CommitHash As String = "' + $env:PCL_BUILD_COMMIT_SHA + '"')
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Plain Craft Launcher 2\obj\${{ matrix.configuration }}\Plain Craft Launcher 2.exe
